# Next.js runtime. Do not publish the old Vite "dist" folder.
# The plugin turns the .next build into the site Netlify actually serves.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
